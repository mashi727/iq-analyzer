name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write   # required to create / upload to a GitHub Release

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync runtime + build dependencies
        run: uv sync --extra build

      - name: Smoke-test the package
        run: uv run pytest -q

      - name: Build single-file EXE with PyInstaller
        shell: cmd
        run: |
          uv run pyinstaller ^
            --onefile ^
            --windowed ^
            --name iq-analyzer ^
            --collect-submodules iq_analyzer ^
            --collect-data pyqtgraph ^
            src/iq_analyzer/__main__.py

      - name: Show output
        shell: cmd
        run: dir dist

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: iq-analyzer-windows
          path: dist/iq-analyzer.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iq-analyzer.exe
          generate_release_notes: true
          draft: false
          prerelease: false
